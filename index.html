<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VR 360 · Visor Inmersivo</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

    :root {
      --ink: #0a0a0f;
      --paper: #f0ede6;
      --accent: #e8420a;
      --accent2: #f5c518;
      --glass: rgba(10, 10, 15, 0.72);
      --border: rgba(240, 237, 230, 0.15);
      --radius: 2px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Syne', sans-serif;
      background: var(--ink);
      color: var(--paper);
      overflow: hidden;
      height: 100dvh;
      width: 100dvw;
    }

    /* ── OVERLAY UI ─────────────────────────────────────────── */
    #ui-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding-bottom: max(32px, env(safe-area-inset-bottom, 32px));
      pointer-events: none;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    #ui-overlay.hidden {
      opacity: 0;
      transform: translateY(24px);
      pointer-events: none;
    }

    /* ── HEADER BADGE ───────────────────────────────────────── */
    #header-badge {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 101;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 8px 16px 8px 10px;
      pointer-events: none;
      transition: opacity 0.6s ease;
    }

    #header-badge.hidden { opacity: 0; }

    .badge-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.7); }
    }

    .badge-text {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--paper);
      opacity: 0.8;
    }

    /* ── PANEL CARD ─────────────────────────────────────────── */
    #control-panel {
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      width: min(340px, calc(100vw - 40px));
      pointer-events: all;
      position: relative;
      overflow: hidden;
    }

    /* diagonal accent stripe */
    #control-panel::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 80px; height: 80px;
      background: var(--accent);
      opacity: 0.08;
      clip-path: polygon(100% 0, 100% 100%, 0 0);
    }

    .panel-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--paper);
      margin-bottom: 4px;
      line-height: 1.1;
    }

    .panel-sub {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--paper);
      opacity: 0.4;
      margin-bottom: 20px;
    }

    /* ── DIVIDER ────────────────────────────────────────────── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    /* ── STEP ROW ───────────────────────────────────────────── */
    .step {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 12px;
    }

    .step-num {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      background: rgba(232, 66, 10, 0.12);
      border: 1px solid rgba(232, 66, 10, 0.3);
      border-radius: 4px;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .step-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--paper);
      opacity: 0.9;
      line-height: 1.2;
    }

    .step-sub {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--paper);
      opacity: 0.4;
      margin-top: 2px;
    }

    /* ── BUTTONS ────────────────────────────────────────────── */
    .btn {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px rgba(232, 66, 10, 0.35);
    }

    .btn-primary:hover { box-shadow: 0 6px 28px rgba(232, 66, 10, 0.5); }

    .btn-secondary {
      background: transparent;
      color: var(--paper);
      border: 1px solid var(--border);
      margin-top: 10px;
    }

    .btn-secondary:hover { background: rgba(240, 237, 230, 0.06); }

    .btn-secondary.granted {
      color: #4ade80;
      border-color: rgba(74, 222, 128, 0.3);
      background: rgba(74, 222, 128, 0.06);
    }

    .btn-secondary.granted:hover { background: rgba(74, 222, 128, 0.1); }

    /* hide native file input */
    #file-input { display: none; }

    /* ── STATUS BAR ─────────────────────────────────────────── */
    #status-bar {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: var(--paper);
      opacity: 0.35;
      text-align: center;
      margin-top: 14px;
      letter-spacing: 0.06em;
    }

    #status-bar span { color: var(--accent2); opacity: 1; }

    /* ── LOADING OVERLAY ────────────────────────────────────── */
    #loading-veil {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      transition: opacity 0.8s ease;
    }

    #loading-veil.fade-out { opacity: 0; pointer-events: none; }

    .loader-ring {
      width: 48px; height: 48px;
      border: 2px solid rgba(240, 237, 230, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loader-text {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.5;
    }

    /* ── VR HINT ────────────────────────────────────────────── */
    #vr-hint {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99;
      background: var(--glass);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 10px 20px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      white-space: nowrap;
    }

    #vr-hint.visible { opacity: 1; }

    /* ── A-FRAME CANVAS OVERRIDE ────────────────────────────── */
    a-scene canvas { display: block; }

    /* Ensure A-Frame VR button is visible */
    .a-enter-vr {
      z-index: 50 !important;
    }
  </style>
</head>

<body>

  <!-- ── LOADING VEIL ───────────────────────────────────── -->
  <div id="loading-veil">
    <div class="loader-ring"></div>
    <div class="loader-text">Iniciando escena VR</div>
  </div>

  <!-- ── A-FRAME SCENE ──────────────────────────────────── -->
  <a-scene
    id="vr-scene"
    vr-mode-ui="enabled: true"
    embedded
    renderer="antialias: true; colorManagement: true"
    loading-screen="dotsColor: #e8420a; backgroundColor: #0a0a0f"
  >
    <a-assets>
      <img id="sky-texture" src="" crossorigin="anonymous" />
    </a-assets>

    <!-- Sky sphere — filled dynamically -->
    <a-sky id="sky" src="#sky-texture" rotation="0 -90 0"></a-sky>

    <!-- Default camera with look-controls for gyroscope / mouse -->
    <a-entity camera look-controls="magicWindowTrackingEnabled: true; reverseMouseDrag: false" position="0 1.6 0">
    </a-entity>
  </a-scene>

  <!-- ── HEADER BADGE ───────────────────────────────────── -->
  <div id="header-badge">
    <div class="badge-dot"></div>
    <span class="badge-text">VR 360 · Visor Inmersivo</span>
  </div>

  <!-- ── MAIN UI OVERLAY ────────────────────────────────── -->
  <div id="ui-overlay">
    <div id="control-panel">
      <div class="panel-title">Visor VR<br>360°</div>
      <div class="panel-sub">Google Cardboard · WebXR</div>

      <!-- Step 1 -->
      <div class="step">
        <div class="step-num">1</div>
        <div>
          <div class="step-label">Cargar imagen 360</div>
          <div class="step-sub">Equirrectangular · JPG / PNG / WEBP</div>
        </div>
      </div>

      <input type="file" id="file-input" accept="image/*" />
      <button class="btn btn-primary" id="btn-load">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Seleccionar imagen
      </button>

      <div class="divider"></div>

      <!-- Step 2 (iOS) -->
      <div class="step">
        <div class="step-num">2</div>
        <div>
          <div class="step-label">Activar giroscopio</div>
          <div class="step-sub">Requerido en iOS 13+</div>
        </div>
      </div>

      <button class="btn btn-secondary" id="btn-gyro">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/></svg>
        Solicitar permiso de giroscopio
      </button>

      <div id="status-bar">Estado: <span id="status-text">Sin imagen cargada</span></div>
    </div>
  </div>

  <!-- ── VR HINT ────────────────────────────────────────── -->
  <div id="vr-hint">
    ↕ Mueve el teléfono para explorar · Presiona VR para Cardboard
  </div>

  <!-- ─────────────────────────────────────────────────── -->
  <script>
    /* ── ELEMENT REFS ───────────────────────────────────── */
    const scene       = document.getElementById('vr-scene');
    const sky         = document.getElementById('sky');
    const skyTexture  = document.getElementById('sky-texture');
    const fileInput   = document.getElementById('file-input');
    const btnLoad     = document.getElementById('btn-load');
    const btnGyro     = document.getElementById('btn-gyro');
    const uiOverlay   = document.getElementById('ui-overlay');
    const headerBadge = document.getElementById('header-badge');
    const statusText  = document.getElementById('status-text');
    const loadingVeil = document.getElementById('loading-veil');
    const vrHint      = document.getElementById('vr-hint');

    /* ── LOADING VEIL ───────────────────────────────────── */
    function hideVeil() {
      if (!loadingVeil.parentNode) return;
      loadingVeil.classList.add('fade-out');
      setTimeout(() => { if (loadingVeil.parentNode) loadingVeil.remove(); }, 900);
    }
    scene.addEventListener('loaded', hideVeil);
    scene.addEventListener('renderstart', hideVeil);
    setTimeout(hideVeil, 4000);

    /* ── FILE LOAD ──────────────────────────────────────── */
    btnLoad.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      // Visual feedback while reading
      btnLoad.innerHTML = `<div class="loader-ring" style="width:18px;height:18px;margin:0"></div> Cargando...`;
      btnLoad.style.opacity = '0.7';
      statusText.textContent = 'Leyendo archivo…';

      const reader = new FileReader();

      reader.onload = (evt) => {
        const dataURL = evt.target.result;

        // Swap texture via A-Frame asset system
        skyTexture.src = dataURL;

        sky.addEventListener('materialtextureloaded', () => {
          sky.setAttribute('src', '#sky-texture');
          statusText.textContent = file.name;

          btnLoad.innerHTML = `
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Imagen cargada
          `;
          btnLoad.style.opacity = '1';

          // Show VR hint
          vrHint.classList.add('visible');
          setTimeout(() => vrHint.classList.remove('visible'), 4000);
        }, { once: true });

        // Fallback: set src directly on a-sky with object URL
        const objectURL = URL.createObjectURL(file);
        sky.setAttribute('src', objectURL);

        btnLoad.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Imagen cargada
        `;
        btnLoad.style.opacity = '1';
        statusText.textContent = file.name;

        vrHint.classList.add('visible');
        setTimeout(() => vrHint.classList.remove('visible'), 4500);
      };

      reader.onerror = () => {
        statusText.textContent = '⚠ Error al leer el archivo';
        btnLoad.innerHTML = 'Reintentar';
        btnLoad.style.opacity = '1';
      };

      reader.readAsDataURL(file);

      // Reset for next pick
      fileInput.value = '';
    });

    /* ── GYROSCOPE PERMISSION (iOS 13+) ─────────────────── */
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

    // Hide gyro button on non-iOS unless DeviceOrientationEvent.requestPermission exists
    if (!isIOS && typeof DeviceOrientationEvent.requestPermission !== 'function') {
      btnGyro.style.display = 'none';
      // Auto-note
      const autoNote = document.createElement('div');
      autoNote.style.cssText = 'font-family:Space Mono,monospace;font-size:10px;opacity:0.4;text-align:center;margin-top:8px;letter-spacing:.06em;';
      autoNote.textContent = 'Giroscopio activo automáticamente en Android';
      btnGyro.parentNode.insertBefore(autoNote, btnGyro.nextSibling);
    }

    btnGyro.addEventListener('click', async () => {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const state = await DeviceOrientationEvent.requestPermission();
          if (state === 'granted') {
            btnGyro.classList.add('granted');
            btnGyro.innerHTML = `
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              Giroscopio activado ✓
            `;

            // Re-enable look-controls on camera entity
            const cam = scene.querySelector('[camera]');
            if (cam) {
              cam.setAttribute('look-controls', 'magicWindowTrackingEnabled: true');
            }
          } else {
            btnGyro.innerHTML = '⚠ Permiso denegado — intenta de nuevo';
          }
        } catch (err) {
          console.error('Gyroscope permission error:', err);
          btnGyro.innerHTML = '⚠ Error al solicitar permiso';
        }
      } else {
        // Android / desktop — permission already available
        btnGyro.classList.add('granted');
        btnGyro.innerHTML = `
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          Giroscopio listo ✓
        `;
      }
    });

    /* ── VR MODE LISTENERS ──────────────────────────────── */
    scene.addEventListener('enter-vr', () => {
      uiOverlay.classList.add('hidden');
      headerBadge.classList.add('hidden');
    });

    scene.addEventListener('exit-vr', () => {
      uiOverlay.classList.remove('hidden');
      headerBadge.classList.remove('hidden');
    });

    /* ── FULL SCREEN ON MOBILE (non-VR) ─────────────────── */
    document.addEventListener('touchstart', () => {
      if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }, { once: true });

    /* ── DEFAULT SKY (gradient placeholder) ─────────────── */
    // If no image is loaded, show a subtle animated sky so the scene isn't blank
    (function setDefaultSky() {
      const canvas = document.createElement('canvas');
      canvas.width = 2048; canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, 0, 1024);
      grad.addColorStop(0, '#050510');
      grad.addColorStop(0.4, '#0d0d2b');
      grad.addColorStop(1, '#1a0a0a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 2048, 1024);

      // Stars
      for (let i = 0; i < 900; i++) {
        const x = Math.random() * 2048;
        const y = Math.random() * 1024;
        const r = Math.random() * 1.2;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.7})`;
        ctx.fill();
      }

      // Subtle horizon glow
      const glow = ctx.createRadialGradient(1024, 950, 0, 1024, 950, 600);
      glow.addColorStop(0, 'rgba(232,66,10,0.18)');
      glow.addColorStop(1, 'rgba(232,66,10,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, 400, 2048, 624);

      sky.setAttribute('src', canvas.toDataURL('image/jpeg', 0.92));
    })();
  </script>

</body>
</html>
