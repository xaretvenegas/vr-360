<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>VR 360 · Visor Inmersivo</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');
    :root {
      --ink: #0a0a0f; --paper: #f0ede6; --accent: #e8420a;
      --accent2: #f5c518; --glass: rgba(10,10,15,0.80);
      --border: rgba(240,237,230,0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }

    /* ── A-FRAME fills screen ── */
    a-scene { width: 100vw !important; height: 100vh !important; }

    /* ── SBS CANVAS overlay ── */
    #sbs-canvas {
      position: fixed; inset: 0;
      width: 100vw; height: 100vh;
      display: none; z-index: 10;
      background: #000;
    }

    /* ── UI OVERLAY ── */
    #ui {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-end;
      padding-bottom: max(28px, env(safe-area-inset-bottom, 28px));
      pointer-events: none;
      transition: opacity .5s ease, transform .5s ease;
    }
    #ui.hidden { opacity: 0; transform: translateY(20px); pointer-events: none; }

    #panel {
      background: var(--glass);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 18px;
      padding: 22px; width: min(340px, calc(100vw - 32px));
      pointer-events: all;
    }
    .title { font-family: 'Syne',sans-serif; font-size: 24px; font-weight: 800;
      color: var(--paper); line-height: 1.05; margin-bottom: 3px; }
    .sub { font-family: 'Space Mono',monospace; font-size: 10px; letter-spacing: .12em;
      text-transform: uppercase; color: var(--paper); opacity: .4; margin-bottom: 18px; }
    .row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
    .num { font-family: 'Space Mono',monospace; font-size: 10px; font-weight: 700;
      color: var(--accent); background: rgba(232,66,10,.12);
      border: 1px solid rgba(232,66,10,.3); border-radius: 4px;
      width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .lbl { font-family: 'Syne',sans-serif; font-size: 13px; font-weight: 700;
      color: var(--paper); line-height: 1.2; }
    .sub2 { font-family: 'Space Mono',monospace; font-size: 10px; color: var(--paper); opacity: .4; margin-top: 1px; }
    hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }

    .btn {
      width: 100%; padding: 13px 16px; border: none; border-radius: 3px;
      font-family: 'Syne',sans-serif; font-size: 13px; font-weight: 700;
      letter-spacing: .04em; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: transform .12s, box-shadow .12s;
    }
    .btn:active { transform: scale(.97); }
    .btn-red  { background: var(--accent); color: #fff; box-shadow: 0 4px 18px rgba(232,66,10,.4); margin-bottom: 8px; }
    .btn-gyro { background: transparent; color: var(--paper); border: 1px solid var(--border); margin-bottom: 8px; }
    .btn-gyro.ok { color: #4ade80; border-color: rgba(74,222,128,.3); background: rgba(74,222,128,.07); }
    .btn-enter { background: var(--accent2); color: var(--ink); font-weight: 800;
      box-shadow: 0 4px 18px rgba(245,197,24,.35); display: none; margin-bottom: 8px; }
    .btn-sbs   { background: #1a1a2e; color: var(--paper); border: 1px solid rgba(100,100,255,.3);
      display: none; }
    .btn-sbs.active { background: rgba(100,100,255,.25); border-color: rgba(100,100,255,.6); }

    #file-input { display: none; }
    #status { font-family: 'Space Mono',monospace; font-size: 10px;
      color: var(--paper); opacity: .35; text-align: center; margin-top: 10px; letter-spacing: .06em; }
    #status span { color: var(--accent2); opacity: 1; }

    /* ── badge ── */
    #badge {
      position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
      z-index: 201; display: flex; align-items: center; gap: 8px;
      background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-radius: 100px;
      padding: 7px 14px 7px 10px; pointer-events: none;
      transition: opacity .5s;
    }
    #badge.hidden { opacity: 0; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
      animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.7)} }
    .badge-txt { font-family: 'Space Mono',monospace; font-size: 11px;
      letter-spacing: .08em; text-transform: uppercase; color: var(--paper); opacity: .8; }

    /* ── veil ── */
    #veil {
      position: fixed; inset: 0; z-index: 300; background: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      transition: opacity .8s;
    }
    #veil.out { opacity: 0; pointer-events: none; }
    .ring { width: 44px; height: 44px; border: 2px solid rgba(240,237,230,.1);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .veil-txt { font-family: 'Space Mono',monospace; font-size: 11px;
      letter-spacing: .15em; text-transform: uppercase; opacity: .45; color: var(--paper); }

    /* ── SBS exit button ── */
    #btn-exit-sbs {
      position: fixed; bottom: max(24px,env(safe-area-inset-bottom,24px));
      left: 50%; transform: translateX(-50%);
      z-index: 50; display: none;
      background: rgba(10,10,15,.75); backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border); border-radius: 100px;
      color: var(--paper); font-family: 'Space Mono',monospace;
      font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
      padding: 10px 20px; cursor: pointer;
    }
  </style>
</head>
<body>

<!-- Loading veil -->
<div id="veil"><div class="ring"></div><div class="veil-txt">Iniciando escena VR</div></div>

<!-- SBS canvas (split-screen manual) -->
<canvas id="sbs-canvas"></canvas>

<!-- A-Frame scene -->
<a-scene id="scene" vr-mode-ui="enabled:true" embedded
  renderer="antialias:true;colorManagement:true"
  loading-screen="enabled:false">
  <a-sky id="sky" rotation="0 -90 0"></a-sky>
  <a-entity id="cam" camera look-controls="magicWindowTrackingEnabled:true" position="0 1.6 0"></a-entity>
</a-scene>

<!-- Badge -->
<div id="badge"><div class="dot"></div><span class="badge-txt">VR 360 · Visor Inmersivo</span></div>

<!-- UI Panel -->
<div id="ui">
  <div id="panel">
    <div class="title">Visor VR<br>360°</div>
    <div class="sub">Google Cardboard · WebXR</div>

    <div class="row">
      <div class="num">1</div>
      <div><div class="lbl">Cargar imagen 360</div><div class="sub2">Equirrectangular · JPG / PNG / WEBP</div></div>
    </div>
    <input type="file" id="file-input" accept="image/*">
    <button class="btn btn-red" id="btn-load">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Seleccionar imagen
    </button>

    <hr>

    <div class="row">
      <div class="num">2</div>
      <div><div class="lbl">Activar giroscopio</div><div class="sub2">Requerido en iOS 13+</div></div>
    </div>
    <button class="btn btn-gyro" id="btn-gyro">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
      Solicitar permiso de giroscopio
    </button>

    <!-- Shown after image loads -->
    <button class="btn btn-enter" id="btn-enter">
      ▶ Entrar al visor 360°
    </button>
    <button class="btn btn-sbs" id="btn-sbs">
      ⊞ Modo Cardboard (Split Screen)
    </button>

    <div id="status">Estado: <span id="status-txt">Sin imagen cargada</span></div>
  </div>
</div>

<!-- Exit SBS -->
<button id="btn-exit-sbs">✕ Salir de Cardboard</button>

<script>
  /* ── refs ── */
  const scene      = document.getElementById('scene');
  const sky        = document.getElementById('sky');
  const cam        = document.getElementById('cam');
  const fileInput  = document.getElementById('file-input');
  const btnLoad    = document.getElementById('btn-load');
  const btnGyro    = document.getElementById('btn-gyro');
  const btnEnter   = document.getElementById('btn-enter');
  const btnSBS     = document.getElementById('btn-sbs');
  const btnExitSBS = document.getElementById('btn-exit-sbs');
  const ui         = document.getElementById('ui');
  const badge      = document.getElementById('badge');
  const statusTxt  = document.getElementById('status-txt');
  const veil       = document.getElementById('veil');
  const sbsCanvas  = document.getElementById('sbs-canvas');

  /* ── veil ── */
  function hideVeil() {
    veil.classList.add('out');
    setTimeout(() => { if (veil.parentNode) veil.remove(); }, 900);
  }
  scene.addEventListener('loaded', hideVeil);
  scene.addEventListener('renderstart', hideVeil);
  setTimeout(hideVeil, 5000);

  /* ── default placeholder sky via canvas ── */
  (function() {
    const c = document.createElement('canvas');
    c.width = 1024; c.height = 512;
    const ctx = c.getContext('2d');
    const g = ctx.createLinearGradient(0,0,0,512);
    g.addColorStop(0,'#050510'); g.addColorStop(.4,'#0d0d2b'); g.addColorStop(1,'#1a0a0a');
    ctx.fillStyle = g; ctx.fillRect(0,0,1024,512);
    for (let i=0;i<600;i++) {
      ctx.beginPath();
      ctx.arc(Math.random()*1024, Math.random()*512, Math.random()*1.1, 0, Math.PI*2);
      ctx.fillStyle = `rgba(255,255,255,${.4+Math.random()*.6})`; ctx.fill();
    }
    sky.setAttribute('src', c.toDataURL('image/jpeg',.9));
  })();

  /* ── load image ── */
  let currentImageEl = null;

  btnLoad.addEventListener('click', () => fileInput.click());

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    fileInput.value = '';

    const img = new Image();
    img.onload = () => {
      // Draw to canvas then use dataURL — bypasses iOS CORS/blob restrictions with A-Frame
      const c = document.createElement('canvas');
      c.width  = Math.min(img.width, 4096);
      c.height = Math.min(img.height, 2048);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const dataURL = c.toDataURL('image/jpeg', 0.92);

      // Store for SBS renderer
      currentImageEl = c;

      // Apply to A-Frame sky
      sky.setAttribute('src', dataURL);

      btnLoad.innerHTML = '✓ Imagen cargada';
      statusTxt.textContent = file.name;
      btnEnter.style.display = 'flex';
      btnSBS.style.display = 'flex';
    };
    img.onerror = () => { statusTxt.textContent = '⚠ Error al cargar imagen'; };

    // Use FileReader for maximum iOS compatibility
    const reader = new FileReader();
    reader.onload = (ev) => { img.src = ev.target.result; };
    reader.readAsDataURL(file);
  });

  /* ── enter viewer (hide UI) ── */
  btnEnter.addEventListener('click', () => {
    ui.classList.add('hidden');
    badge.classList.add('hidden');
  });

  /* ── VR mode (A-Frame native) ── */
  scene.addEventListener('enter-vr', () => {
    ui.classList.add('hidden');
    badge.classList.add('hidden');
  });
  scene.addEventListener('exit-vr', () => {
    if (sbsCanvas.style.display === 'none' || !sbsCanvas.style.display) {
      ui.classList.remove('hidden');
      badge.classList.remove('hidden');
    }
  });

  /* ── SBS / Cardboard mode ── */
  let sbsRunning = false;
  let sbsRAF = null;

  btnSBS.addEventListener('click', () => {
    if (!currentImageEl) return;
    enterSBS();
  });

  btnExitSBS.addEventListener('click', exitSBS);

  function enterSBS() {
    // Request fullscreen/landscape
    const el = document.documentElement;
    const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
    if (rfs) rfs.call(el).catch(() => {});

    // Lock orientation to landscape if available
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }

    // Hide A-Frame, show SBS canvas
    scene.style.display = 'none';
    sbsCanvas.style.display = 'block';
    ui.classList.add('hidden');
    badge.classList.add('hidden');
    btnExitSBS.style.display = 'block';

    sbsCanvas.width  = window.screen.width  * window.devicePixelRatio;
    sbsCanvas.height = window.screen.height * window.devicePixelRatio;

    sbsRunning = true;
    renderSBS();
  }

  function exitSBS() {
    sbsRunning = false;
    if (sbsRAF) cancelAnimationFrame(sbsRAF);
    sbsCanvas.style.display = 'none';
    scene.style.display = '';
    btnExitSBS.style.display = 'none';
    ui.classList.remove('hidden');
    badge.classList.remove('hidden');
    if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
    if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
  }

  // Simple SBS: draw image twice side by side with yaw offset from DeviceOrientation
  let yaw = 0, pitch = 0;
  window.addEventListener('deviceorientation', (e) => {
    // Alpha = compass yaw (0-360), Beta = front-back tilt, Gamma = left-right tilt
    if (e.alpha !== null) yaw   = e.alpha  * Math.PI / 180;
    if (e.beta  !== null) pitch = e.beta   * Math.PI / 180;
  });

  function renderSBS() {
    if (!sbsRunning || !currentImageEl) return;

    const ctx  = sbsCanvas.getContext('2d');
    const W    = sbsCanvas.width;
    const H    = sbsCanvas.height;
    const half = W / 2;
    const imgW = currentImageEl.width;
    const imgH = currentImageEl.height;

    // Field of view ~90 degrees
    const fovX = Math.PI / 2;
    const fovY = fovX * (H / half);

    // Source crop width/height in the equirectangular image
    const srcW = imgW * (fovX / (2 * Math.PI));
    const srcH = imgH * (fovY / Math.PI);

    // Center of crop from yaw
    const centerX = ((yaw / (2 * Math.PI)) * imgW + imgW) % imgW;
    const centerY = imgH / 2 + (pitch / Math.PI) * imgH * 0.5;

    let srcX = centerX - srcW / 2;
    let srcY = Math.max(0, Math.min(imgH - srcH, centerY - srcH / 2));

    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Left eye
    drawEyeWrapped(ctx, currentImageEl, imgW, imgH, srcX, srcY, srcW, srcH, 0, 0, half, H);
    // Right eye (slight offset for stereoscopy)
    const ipd = imgW * 0.01;
    drawEyeWrapped(ctx, currentImageEl, imgW, imgH, srcX + ipd, srcY, srcW, srcH, half, 0, half, H);

    // Separator line
    ctx.fillStyle = '#000';
    ctx.fillRect(half - 1, 0, 2, H);

    sbsRAF = requestAnimationFrame(renderSBS);
  }

  function drawEyeWrapped(ctx, src, imgW, imgH, sx, sy, sw, sh, dx, dy, dw, dh) {
    sx = ((sx % imgW) + imgW) % imgW;
    const right = sx + sw;

    if (right <= imgW) {
      ctx.drawImage(src, sx, sy, sw, sh, dx, dy, dw, dh);
    } else {
      // Wraps around — draw in two parts
      const w1 = imgW - sx;
      const w2 = right - imgW;
      const split = dw * (w1 / sw);
      ctx.drawImage(src, sx, sy, w1, sh, dx,         dy, split,      dh);
      ctx.drawImage(src, 0,  sy, w2, sh, dx + split, dy, dw - split, dh);
    }
  }

  /* ── gyroscope permission ── */
  if (typeof DeviceOrientationEvent === 'undefined' ||
      typeof DeviceOrientationEvent.requestPermission !== 'function') {
    btnGyro.classList.add('ok');
    btnGyro.innerHTML = '✓ Giroscopio listo (Android)';
  }

  btnGyro.addEventListener('click', async () => {
    if (typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const s = await DeviceOrientationEvent.requestPermission();
        if (s === 'granted') {
          btnGyro.classList.add('ok');
          btnGyro.innerHTML = '✓ Giroscopio activado';
        } else {
          btnGyro.innerHTML = '⚠ Permiso denegado';
        }
      } catch(err) { btnGyro.innerHTML = '⚠ Error: ' + err.message; }
    }
  });

  /* ── fullscreen on first touch ── */
  document.addEventListener('touchstart', () => {
    const el = document.documentElement;
    const rfs = el.requestFullscreen || el.webkitRequestFullscreen;
    if (rfs && !document.fullscreenElement) rfs.call(el).catch(() => {});
  }, { once: true });
</script>
</body>
</html>
